name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    actions: read

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: windows-latest
                    - platform: ubuntu-22.04
                    - platform: macos-latest # Apple Silicon
                      args: '--target aarch64-apple-darwin'
                    - platform: macos-latest # Intel Macs
                      args: '--target x86_64-apple-darwin'

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: packages/gui/src-tauri

            - name: Install Linux dependencies (Tauri v2)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
                    libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

            - name: Install frontend dependencies
              run: npm ci

            # The GUI imports @seymi/dnss-core through its built dist/ outputs,
            # which the gui `build` script does not produce itself.
            - name: Build shared core
              run: npm run build:core

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: packages/gui
                  tagName: ${{ github.ref_name }}
                  releaseName: 'DNSS ${{ github.ref_name }}'
                  releaseBody: >-
                      Installers for Windows, macOS and Linux. The Windows NSIS
                      installer asks for UAC once during setup to install the
                      DnssService background service — launching the app and
                      switching DNS require no further UAC prompts. macOS and
                      Linux ask for credentials when a DNS change is applied.
                  releaseDraft: true
                  prerelease: false
                  args: ${{ matrix.args }}

            - name: Upload unsigned Windows artifacts for SignPath
              id: upload-unsigned-windows
              if: ${{ matrix.platform == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true' }}
              uses: actions/upload-artifact@v4
              with:
                  name: unsigned-windows-artifacts
                  path: |
                      packages/gui/src-tauri/target/release/dnss.exe
                      packages/gui/src-tauri/target/release/bundle/nsis/*.exe
                      packages/gui/src-tauri/target/release/bundle/msi/*.msi
                  if-no-files-found: error

            - name: Sign Windows artifacts with SignPath
              if: ${{ matrix.platform == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true' }}
              uses: signpath/github-action-submit-signing-request@v3
              with:
                  api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
                  organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
                  project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'dnss' }}
                  signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
                  github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
                  wait-for-completion: true
                  output-artifact-directory: packages/gui/src-tauri/target/release/signed

            - name: Replace Windows release assets with signed artifacts
              if: ${{ matrix.platform == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true' }}
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $files = Get-ChildItem -Path "packages/gui/src-tauri/target/release/signed" -Recurse -File -Include *.exe,*.msi | Select-Object -ExpandProperty FullName
                  if (-not $files) {
                      throw "No signed Windows artifacts found in packages/gui/src-tauri/target/release/signed"
                  }
                  gh release upload "${{ github.ref_name }}" @files --clobber --repo "${{ github.repository }}"

    publish:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
