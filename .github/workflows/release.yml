name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: windows-latest
                    - platform: ubuntu-22.04
                    - platform: macos-latest # Apple Silicon
                      args: '--target aarch64-apple-darwin'
                    - platform: macos-latest # Intel Macs
                      args: '--target x86_64-apple-darwin'

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: packages/gui/src-tauri

            - name: Install Linux dependencies (Tauri v2)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
                    libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

            - name: Install frontend dependencies
              run: npm ci

            # The GUI imports @seymi/dnss-core through its built dist/ outputs,
            # which the gui `build` script does not produce itself.
            - name: Build shared core
              run: npm run build:core

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: packages/gui
                  tagName: ${{ github.ref_name }}
                  releaseName: 'DNSS ${{ github.ref_name }}'
                  releaseBody: >-
                      Installers for Windows, macOS and Linux. Windows builds run
                      elevated (the OS asks for admin once per launch); macOS and
                      Linux ask for credentials when a DNS change is applied.
                  releaseDraft: false
                  prerelease: false
                  args: ${{ matrix.args }}
