name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: TypeScript (typecheck, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build core (tests import its dist output)
        run: npm run build:core
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build CLI
        run: npm run build:cli
      - name: Build GUI frontend
        run: npm run build:gui

  rust:
    name: Rust backend (cargo check) — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check --manifest-path packages/gui/src-tauri/Cargo.toml
      - name: cargo fmt
        run: cargo fmt --manifest-path packages/gui/src-tauri/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path packages/gui/src-tauri/Cargo.toml -- -D warnings
