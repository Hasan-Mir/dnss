[package]
name = "dnss"
version = "0.1.0"
description = "DNSS (DNS Switcher) - change your DNS servers with one click"
license = "MIT"
edition = "2021"

[lib]
name = "dnss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
